# Managed with prek (https://github.com/j178/prek): `prek install` to enable,
# `prek run --all-files` to check the whole repo.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: agent-mail-guard
        name: agent-mail lease guard
        entry: pwsh -NoProfile -File C:/Users/lefto/.claude/tools/agent-mail/guard-check.ps1
        language: system
        pass_filenames: true
        stages: [pre-commit]
