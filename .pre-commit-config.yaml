# Managed with prek (https://github.com/j178/prek): `prek install` to enable,
# `prek run --all-files` to check the whole repo.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # Vendored Leaflet ships leaflet.js without a final newline; rewriting
        # it would break its upstream sha256 (tests/test_weather_index_assets.py)
        exclude: '^scripts/weather_daemon/assets/'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'
      - id: trailing-whitespace
        exclude: '^scripts/weather_daemon/assets/'

  - repo: local
    hooks:
      - id: agent-mail-guard
        name: agent-mail lease guard
        entry: pwsh -NoProfile -File tools/agent-mail-guard.ps1
        language: system
        pass_filenames: true
        stages: [pre-commit]
