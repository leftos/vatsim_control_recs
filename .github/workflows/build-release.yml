name: Build & Release

on:
  push:
    paths-ignore: ["**.md"]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: vatsim_control_recs-windows
            archive_cmd: Compress-Archive -Path dist/vatsim_control_recs/* -DestinationPath vatsim_control_recs-windows.zip
            archive_ext: zip
          - os: ubuntu-latest
            artifact: vatsim_control_recs-linux
            archive_cmd: tar -czf vatsim_control_recs-linux.tar.gz -C dist vatsim_control_recs
            archive_ext: tar.gz
          - os: macos-latest
            artifact: vatsim_control_recs-macos
            archive_cmd: tar -czf vatsim_control_recs-macos.tar.gz -C dist vatsim_control_recs
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group build --group dev

      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Build with PyInstaller
        run: uv run pyinstaller vatsim_control_recs.spec --noconfirm

      - name: Archive build
        run: ${{ matrix.archive_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive_ext }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Create rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release_notes.md <<'NOTES'
          Automated build from the latest commit on `main`.

          ## Download

          | Platform | File |
          |----------|------|
          | Windows  | `vatsim_control_recs-windows.zip` |
          | macOS (Apple Silicon) | `vatsim_control_recs-macos.tar.gz` |
          | Linux    | `vatsim_control_recs-linux.tar.gz` |

          ## Usage

          **Windows**: Extract the zip, then run `vatsim_control_recs\vatsim_control_recs.exe`

          **macOS**: Extract and run:
          ```
          tar xzf vatsim_control_recs-macos.tar.gz
          ./vatsim_control_recs/vatsim_control_recs
          ```
          > First launch: right-click the executable → Open (macOS Gatekeeper requires this for unsigned apps)

          **Linux**: Extract and run:
          ```
          tar xzf vatsim_control_recs-linux.tar.gz
          ./vatsim_control_recs/vatsim_control_recs
          ```

          All command-line options (e.g. `--airports KSFO KLAX`) work the same as the Python version.
          NOTES
          sed -i 's/^          //' release_notes.md
          gh release create latest \
            artifacts/vatsim_control_recs-windows/vatsim_control_recs-windows.zip \
            artifacts/vatsim_control_recs-linux/vatsim_control_recs-linux.tar.gz \
            artifacts/vatsim_control_recs-macos/vatsim_control_recs-macos.tar.gz \
            --prerelease \
            --title "Latest Build" \
            --notes-file release_notes.md
