# Ruff configuration - https://docs.astral.sh/ruff/
#
# Lower than pyproject.toml's requires-python (3.13) on purpose: raising it lets
# the UP rules rewrite code across the repo, which belongs in its own change.
# The `X | None` annotations this config enforces need at least 3.10.
target-version = "py310"

# Matches the existing formatting of the codebase. Long string literals are not
# wrapped by the formatter, so E501 is disabled below rather than fought.
line-length = 88

# No extend-exclude: ruff's defaults already skip .venv, build and dist, and a
# bare name here matches every path component, so "data" would silently hide
# backend/data/ as well as the top-level data files.

[lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C901", # mccabe complexity
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PERF", # perflint
    "DTZ",  # flake8-datetimez
    "RUF",  # ruff-specific
    "S110", # try-except-pass, which hides failures
]

ignore = [
    # The formatter owns line breaking; the remaining violations are long string
    # literals such as argparse help text, which it cannot split.
    "E501",
    # Every occurrence guards one iteration so a single bad file or row is
    # skipped rather than aborting the batch. Hoisting the try out of the loop
    # would change that behaviour, which is the only fix the rule offers.
    "PERF203",
]

# BLE001 (blind except) is deliberately not selected. A TUI that stays up when a
# weather or VATSIM request misbehaves needs broad handlers, and the rule only
# accepts a logger built by a local logging.getLogger() call - it cannot see
# through common.logger or ui.debug_logger. Satisfying it would mean bypassing
# those wrappers in every handler. S110 above still catches the real problem,
# which is swallowing an exception without recording it.

[lint.mccabe]
# The repo's limit is a cyclomatic complexity of 8, which C901 enforces here.
max-complexity = 8

[lint.per-file-ignores]
# C901 is a ratchet: every file below still holds a function over the complexity
# limit, all of them predating the rule. Splitting a file's offenders takes its
# entry off this list, and docs/plans/MAIN.md tracks the rest.
"airport_disambiguator/__main__.py" = ["C901"]
"airport_disambiguator/disambiguation_engine.py" = ["C901"]
"airport_disambiguator/entity_extractor.py" = ["C901"]
"airport_disambiguator/name_processor.py" = ["C901"]
"backend/briefing/taf_parsing.py" = ["C901"]
