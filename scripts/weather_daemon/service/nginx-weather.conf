# VATSIM Weather Briefings - Nginx Snippet
# Installed as /etc/nginx/snippets/weather.conf by
# scripts/weather_daemon/service/install-nginx.sh, which adds
# `include snippets/weather.conf;` to the leftos.dev TLS server block of
# /etc/nginx/sites-available/leftos.dev and /etc/nginx/sites-enabled/leftos.dev.
#
# This configuration:
# - Serves weather briefings from /var/www/leftos.dev/weather/
# - Completely disables browser caching (content updates every 15 minutes)
# - Enables directory listing for ARTCC subdirectories

# Weather briefings - NO CACHING
location /weather/ {
    alias /var/www/leftos.dev/weather/;
    index index.html;
    try_files $uri $uri/ =404;

    # Enable directory listing for ARTCC subdirectories
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Completely disable caching
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

# Vendored map assets - the path carries the version, so cache forever.
# ^~ makes this prefix win over the /weather/ block above and over any regex
# location in the server block (such as a site-wide *.js/*.css cache rule).
location ^~ /weather/assets/ {
    alias /var/www/leftos.dev/weather/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
